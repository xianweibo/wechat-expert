services:
  # --- Node.js 后端服务 ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gzh-expert-app
    restart: unless-stopped
    ports:
      # 只绑定宿主机回环：公网无法直连，宿主机上的宝塔 nginx 通过
      # 127.0.0.1:39800 反代访问；外部操作走 SSH 隧道或域名(HTTPS)
      - "127.0.0.1:39800:3000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data/uploads:/app/uploads
      # .env 绑定挂载：配合 .dockerignore（不打入镜像），扫码登录写 .env
      # 时直接落盘到宿主机，重启/重建容器均不丢失
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gzh-network

  # --- PostgreSQL 数据库 ---
  postgres:
    image: postgres:16-alpine
    container_name: gzh-expert-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gzh_expert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-gzh_expert}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gzh_expert}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gzh-network

volumes:
  postgres_data:

networks:
  gzh-network:
    driver: bridge