services:
  # --- Node.js 后端服务 ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gzh-expert-app
    restart: unless-stopped
    # host 网络: 容器内 127.0.0.1 直接等于宿主机, 方便调用 frp visitor 暴露的
    # NAS ASR 服务(127.0.0.1:41092)而无需在容器网络层做端口映射
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data/uploads:/app/uploads
      - ./.env:/app/.env
      - ./style_summary.txt:/app/style_summary.txt:ro
    depends_on:
      postgres:
        condition: service_healthy

  # --- PostgreSQL 数据库 ---
  postgres:
    image: postgres:16-alpine
    container_name: gzh-expert-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gzh_expert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-gzh_expert}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gzh_expert}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gzh-network

volumes:
  postgres_data:

networks:
  gzh-network:
    driver: bridge